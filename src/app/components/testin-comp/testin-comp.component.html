      <div class="steps-container">
        <div class="timeline"></div>
        <div *ngFor="let step of steps" class="step-item">
          <div class="step-number">{{ step.number }}</div>
          <div class="step-content">
            <h3>{{ step.title }}</h3>
            <p>{{ step.description }}</p>
          </div>
        </div>
      </div>
